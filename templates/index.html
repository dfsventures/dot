<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot — Conversations</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #4a9eff;
    --user-bg: #1e2d3d;
    --assistant-bg: #1a1a1a;
    --tool-bg: #111;
    --sidebar-w: 220px;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ─────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 1.1rem 1rem 0.8rem;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
  #sidebar-header p  { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
  #session-list { overflow-y: auto; flex: 1; padding: 0.5rem 0; }
  .session-item {
    padding: 0.55rem 1rem;
    cursor: pointer;
    border-radius: 6px;
    margin: 0 0.4rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: var(--muted);
    transition: background 0.1s;
  }
  .session-item:hover  { background: #222; color: var(--text); }
  .session-item.active { background: #222; color: var(--text); }
  .session-item .dot  { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: 0; flex-shrink: 0; }
  .session-item.active .dot { opacity: 1; }
  .session-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .count { font-size: 0.7rem; color: #555; flex-shrink: 0; }
  #refresh-btn {
    margin: 0.5rem 0.9rem 0.9rem;
    padding: 0.4rem 0.7rem;
    font-size: 0.75rem;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    width: calc(var(--sidebar-w) - 1.8rem);
  }
  #refresh-btn:hover { border-color: #444; color: var(--text); }

  /* ── Main panel ──────────────────────────────── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #chat-header {
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    min-height: 54px;
  }
  #chat-title { font-size: 0.9rem; font-weight: 600; }
  #chat-meta  { font-size: 0.75rem; color: var(--muted); }
  #live-badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    background: #1e2a1e;
    color: #5cbf5c;
    border: 1px solid #2a3d2a;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  #empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ── Message bubbles ─────────────────────────── */
  .msg-row {
    padding: 0.3rem 1.25rem;
    display: flex;
    flex-direction: column;
  }
  .msg-row.user     { align-items: flex-end; }
  .msg-row.assistant{ align-items: flex-start; }
  .bubble {
    max-width: 72%;
    padding: 0.6rem 0.9rem;
    border-radius: 14px;
    font-size: 0.875rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.user .bubble {
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
    color: #cde;
  }
  .msg-row.assistant .bubble {
    background: var(--assistant-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .tool-line {
    font-size: 0.75rem;
    color: #556;
    font-style: italic;
    padding: 0.1rem 0;
  }
  .msg-row.assistant .tool-line { padding-left: 0.2rem; }

  /* ── Spinner ─────────────────────────────────── */
  #spinner {
    display: none;
    position: fixed;
    top: 1rem; right: 1rem;
    background: #222;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 0.3rem 0.65rem;
    font-size: 0.75rem;
    color: var(--muted);
  }

  /* ── Mobile ──────────────────────────────────── */
  @media (max-width: 600px) {
    #sidebar { width: 160px; min-width: 160px; }
    .bubble  { max-width: 90%; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Dot</h1>
    <p>Conversations</p>
  </div>
  <div id="session-list">
    {% for s in sessions %}
    <div class="session-item {% if loop.first %}active{% endif %}"
         data-name="{{ s.name }}"
         onclick="loadSession('{{ s.name }}', this)">
      <span class="dot"></span>
      <span class="name">{{ s.name }}</span>
      <span class="count">{{ s.message_count }}</span>
    </div>
    {% endfor %}
  </div>
  <button id="refresh-btn" onclick="refreshSidebar()">Refresh</button>
</div>

<div id="main">
  <div id="chat-header">
    <span id="chat-title">{{ default_session }}</span>
    <span id="chat-meta"></span>
    <span id="live-badge">● live</span>
  </div>
  <div id="messages"></div>
</div>

<div id="spinner">Loading…</div>

<script>
let currentSession = "{{ default_session }}";
let pollTimer = null;
let lastCount = 0;

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderMessages(messages) {
  const container = document.getElementById("messages");
  if (!messages.length) {
    container.innerHTML = '<div id="empty-state">No messages yet.</div>';
    return;
  }
  container.innerHTML = messages.map(m => {
    const isToolLine = m.text.startsWith("[Tool:") || m.text.startsWith("[Result:");
    if (isToolLine && m.role === "assistant") {
      return `<div class="msg-row assistant"><span class="tool-line">${escHtml(m.text)}</span></div>`;
    }
    return `<div class="msg-row ${m.role}"><div class="bubble">${escHtml(m.text)}</div></div>`;
  }).join("");
  // Scroll to bottom
  container.scrollTop = container.scrollHeight;
}

async function loadSession(name, el) {
  document.querySelectorAll(".session-item").forEach(e => e.classList.remove("active"));
  if (el) el.classList.add("active");
  currentSession = name;
  document.getElementById("chat-title").textContent = name;
  document.getElementById("chat-meta").textContent = "";
  document.getElementById("spinner").style.display = "block";
  clearTimeout(pollTimer);
  lastCount = 0;
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(name)}`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    renderMessages(data.messages);
    lastCount = data.messages.length;
    document.getElementById("chat-meta").textContent = `${data.messages.length} messages`;
  } catch(e) {
    document.getElementById("messages").innerHTML =
      '<div id="empty-state">Error loading session.</div>';
  } finally {
    document.getElementById("spinner").style.display = "none";
    schedulePoll();
  }
}

async function poll() {
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(currentSession)}`);
    if (!res.ok) return;
    const data = await res.json();
    if (data.messages.length !== lastCount) {
      renderMessages(data.messages);
      lastCount = data.messages.length;
      document.getElementById("chat-meta").textContent = `${data.messages.length} messages`;
    }
  } finally {
    schedulePoll();
  }
}

function schedulePoll() {
  pollTimer = setTimeout(poll, 5000);
}

async function refreshSidebar() {
  const res = await fetch("/api/sessions");
  if (!res.ok) return;
  const sessions = await res.json();
  const list = document.getElementById("session-list");
  list.innerHTML = sessions.map(s =>
    `<div class="session-item${s.name===currentSession?' active':''}"
          data-name="${s.name}"
          onclick="loadSession('${s.name}', this)">
       <span class="dot"></span>
       <span class="name">${s.name}</span>
       <span class="count">${s.message_count}</span>
     </div>`
  ).join("");
}

// Initial load
loadSession(currentSession, document.querySelector(".session-item.active"));
</script>
</body>
</html>
