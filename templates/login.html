<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 360px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.4rem; }
  p  { color: #888; font-size: 0.875rem; margin-bottom: 1.5rem; }
  input[type=password] {
    width: 100%;
    padding: 0.65rem 0.85rem;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 1rem;
    outline: none;
    margin-bottom: 0.75rem;
  }
  input[type=password]:focus { border-color: #555; }
  button {
    width: 100%;
    padding: 0.65rem;
    background: #e8e8e8;
    color: #0f0f0f;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #fff; }
  .error { color: #ff6b6b; font-size: 0.8rem; margin-bottom: 0.75rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Dot</h1>
  <p>Conversation viewer</p>
  <form method="post" action="/login">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
